name: Build GameForge AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate Android source and templates
        run: python scripts/validate_source.py
      - name: Check Android startup safety
        run: python scripts/check-startup-safety.py
      - name: Check offline coding agent safety
        run: python scripts/check-phase2.py
      - name: Validate JavaScript syntax
        run: bash scripts/check-js.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.14206865" "cmake;3.31.6"
      - name: Set up Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
      - name: Assemble debug APK with bundled llama.cpp
        run: gradle --no-daemon --stacktrace -p android assembleDebug
      - name: Verify APK contents and package metadata
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.gameforgeai.studio'"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/libgameforge_llama.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/x86_64/libgameforge_llama.so'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gameforge-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Smoke test on Android 12 emulator
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -no-snapshot -noaudio -gpu swiftshader_indirect
          emulator-boot-timeout: 1200
          script: bash scripts/smoke-test-android.sh
      - name: Upload Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameforge-startup-diagnostics
          path: |
            startup-logcat.txt
            activity-dump.txt
            exit-info.txt
            startup-screen.png
          if-no-files-found: ignore
          retention-days: 7
