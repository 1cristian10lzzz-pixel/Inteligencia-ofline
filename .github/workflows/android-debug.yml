name: Build GameForge AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, gameforge-minefade-phase1-2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate Android source and templates
        run: python scripts/validate_source.py
      - name: Check Android startup safety
        run: python scripts/check-startup-safety.py
      - name: Check offline coding agent safety
        run: python scripts/check-phase2.py
      - name: Check Minefade-specific Phase 1 and 2 integration
        run: python scripts/check-gameforge-phase12.py
      - name: Validate JavaScript syntax
        run: bash scripts/check-js.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-31" "platforms;android-36" "build-tools;36.0.0" \
            "emulator" "ndk;29.0.14206865" "cmake;3.31.6"
      - name: Verify hardware acceleration for Android emulator
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Set up Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
      - name: Prepare bundled Minefade source and offline AI model
        run: bash scripts/prepare-bundled-assets.sh
      - name: Verify bundled model and Minefade snapshot
        run: python3 scripts/check-bundled-assets.py
      - name: Assemble debug APK with bundled llama.cpp and GGUF
        run: gradle --no-daemon --stacktrace -p android assembleDebug
      - name: Verify APK contents and package metadata
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.gameforgeai.studio'"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/libgameforge_llama.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/x86_64/libgameforge_llama.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/models/qwen2.5-coder-0.5b-instruct-q3_k_m.gguf'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/builtin/minefade-source.zip'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gameforge-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Smoke test on Android 12 emulator
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -accel on
          emulator-boot-timeout: 1200
          script: bash scripts/smoke-test-android.sh
      - name: Upload Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameforge-startup-diagnostics
          path: |
            startup-logcat.txt
            activity-dump.txt
            exit-info.txt
            startup-screen.png
            startup-meminfo.txt
            startup-result.txt
          if-no-files-found: ignore
          retention-days: 7
